name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  static-checks:
    name: Lint, format and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # shared-types is a build dependency of both apps' typechecks.
      - name: Build shared types
        run: npm run build --workspace @admin-console/shared-types

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --audit-level=high

  test-api:
    name: API integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: admin_console
          POSTGRES_PASSWORD: local_dev_password
          POSTGRES_DB: admin_console_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin_console"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://admin_console:local_dev_password@localhost:5432/admin_console_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @admin-console/shared-types

      - name: Apply migrations to the test database
        run: npx node-pg-migrate -m apps/api/migrations up
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - run: npm test --workspace @admin-console/api

  test-web:
    name: Web component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @admin-console/shared-types
      - run: npm test --workspace @admin-console/web
      - run: npm run build --workspace @admin-console/web

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [test-api, test-web]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: admin_console
          POSTGRES_PASSWORD: local_dev_password
          POSTGRES_DB: admin_console
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin_console"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://admin_console:local_dev_password@localhost:5432/admin_console
      DATABASE_SSL: 'false'
      # Elasticsearch is not run in CI; logs go to stdout only.
      AUTH_MODE: dev
      DEV_AUTH_EMAIL: dev.admin@example.com
      LOG_LEVEL: warn
      VITE_AUTH_MODE: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @admin-console/shared-types

      - name: Migrate and seed
        run: |
          npx node-pg-migrate -m apps/api/migrations up
          npm run db:seed --workspace @admin-console/api

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/e2e

      # playwright.config.ts starts the API and web dev servers itself.
      - run: npm test --workspace @admin-console/e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [static-checks]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only - pushing happens in the deploy workflow, so a PR from a
      # fork can never publish an image.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: admin-console-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: admin-console-web:${{ github.sha }}
          build-args: VITE_AUTH_MODE=entra
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      # No credentials needed: -backend=false validates syntax and types only.
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
        working-directory: infra/terraform/envs/dev
