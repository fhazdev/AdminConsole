name: Deploy (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: 'Run terraform apply (otherwise plan only)'
        type: boolean
        default: false

# Never let two deploys race for the same Terraform state lock.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

# Federated credentials (OIDC) rather than a stored service principal secret.
permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22'
  TF_WORKDIR: infra/terraform/envs/dev

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      registry: ${{ steps.tf-output.outputs.registry }}
      resource_group: ${{ steps.tf-output.outputs.resource_group }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Init
        run: terraform init -input=false -backend-config=backend.hcl
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          ARM_USE_OIDC: 'true'

      - name: Plan
        run: terraform plan -input=false -out=tfplan
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          ARM_USE_OIDC: 'true'
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # Neon is provisioned by hand; Terraform only stores its connection
          # string in Key Vault.
          TF_VAR_neon_connection_string: ${{ secrets.NEON_CONNECTION_STRING }}
          TF_VAR_entra_tenant_id: ${{ secrets.ENTRA_TENANT_ID }}
          TF_VAR_entra_api_audience: ${{ secrets.ENTRA_API_AUDIENCE }}
          TF_VAR_entra_web_client_id: ${{ secrets.ENTRA_WEB_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKDIR }}/tfplan
          retention-days: 1

      - name: Read existing outputs
        id: tf-output
        run: |
          echo "registry=$(terraform output -raw container_registry_login_server 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
          echo "resource_group=$(terraform output -raw resource_group_name 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          ARM_USE_OIDC: 'true'

  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: [plan]
    # 'dev-apply' should require a reviewer in the repo's environment settings,
    # which is what makes this the manual approval gate.
    environment: dev-apply
    if: github.event_name == 'push' || inputs.apply
    outputs:
      registry: ${{ steps.outputs.outputs.registry }}
      resource_group: ${{ steps.outputs.outputs.resource_group }}
      web_url: ${{ steps.outputs.outputs.web_url }}
      api_app: ${{ steps.outputs.outputs.api_app }}
      web_app: ${{ steps.outputs.outputs.web_app }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKDIR }}

      - name: Init
        run: terraform init -input=false -backend-config=backend.hcl
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          ARM_USE_OIDC: 'true'

      - name: Apply the reviewed plan
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          ARM_USE_OIDC: 'true'

      - name: Collect outputs
        id: outputs
        run: |
          {
            echo "registry=$(terraform output -raw container_registry_login_server)"
            echo "resource_group=$(terraform output -raw resource_group_name)"
            echo "web_url=$(terraform output -raw web_url)"
          } >> "$GITHUB_OUTPUT"
          echo "api_app=ca-admincon-dev-api" >> "$GITHUB_OUTPUT"
          echo "web_app=ca-admincon-dev-web" >> "$GITHUB_OUTPUT"
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          ARM_USE_OIDC: 'true'

  migrate-and-deploy:
    name: Migrate database and roll out images
    runs-on: ubuntu-latest
    needs: [apply]
    environment: dev-apply
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: npm ci

      # Migrations run before the new image, so the schema is always at least
      # as new as the code reading it. Migrations must stay backward compatible
      # for the window where old and new revisions overlap.
      - name: Run migrations against Neon
        run: npx node-pg-migrate -m apps/api/migrations up
        env:
          DATABASE_URL: ${{ secrets.NEON_CONNECTION_STRING }}

      - name: Log in to ACR
        run: az acr login --name "${{ needs.apply.outputs.registry }}"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ needs.apply.outputs.registry }}/admin-console-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ needs.apply.outputs.registry }}/admin-console-web:${{ github.sha }}
          build-args: |
            VITE_AUTH_MODE=entra
            VITE_ENTRA_TENANT_ID=${{ secrets.ENTRA_TENANT_ID }}
            VITE_ENTRA_CLIENT_ID=${{ secrets.ENTRA_WEB_CLIENT_ID }}
            VITE_ENTRA_API_SCOPE=${{ secrets.ENTRA_API_SCOPE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Terraform ignores image changes, so the rollout is an explicit az call.
      - name: Roll out new revisions
        run: |
          az containerapp update \
            --name "${{ needs.apply.outputs.api_app }}" \
            --resource-group "${{ needs.apply.outputs.resource_group }}" \
            --image "${{ needs.apply.outputs.registry }}/admin-console-api:${{ github.sha }}"
          az containerapp update \
            --name "${{ needs.apply.outputs.web_app }}" \
            --resource-group "${{ needs.apply.outputs.resource_group }}" \
            --image "${{ needs.apply.outputs.registry }}/admin-console-web:${{ github.sha }}"

  smoke:
    name: Post-deploy smoke tests
    runs-on: ubuntu-latest
    needs: [apply, migrate-and-deploy]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/e2e

      # E2E_BASE_URL makes playwright.config.ts skip its local webServer and
      # drive the deployed environment instead.
      #
      # Note: the deployed console uses real Entra sign-in, so this run covers
      # the unauthenticated surface (the app loads, serves its assets, and the
      # API answers its health probe). Driving the authenticated journey
      # against Azure needs a dedicated test account and a stored MSAL session,
      # which is not wired up yet.
      - name: Smoke test the deployed console
        run: |
          curl --fail --silent --show-error --max-time 30 "${{ needs.apply.outputs.web_url }}/healthz"
          curl --fail --silent --show-error --max-time 30 -o /dev/null "${{ needs.apply.outputs.web_url }}/"
          echo "Deployed console responded at ${{ needs.apply.outputs.web_url }}"
