# Local development stack. Mirrors what runs in the Container Apps environment:
# Postgres stands in for Neon, and Elasticsearch/Kibana are configured exactly
# as they are in Azure - single node, security disabled, no persistent volume.
services:
  postgres:
    image: postgres:17-alpine
    container_name: admin-console-postgres
    environment:
      POSTGRES_USER: admin_console
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: admin_console
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin_console -d admin_console']
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    container_name: admin-console-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.enrollment.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    # No volume, matching the ephemeral-by-design Container App.
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.1
    container_name: admin-console-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: 'false'
    ports:
      - '5601:5601'
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  postgres-data:
